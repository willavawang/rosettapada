<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo in the header · Rosettapada</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles.css">
<style>
body { background: #e9e8e1; overflow: auto; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 48px 32px 120px; }
h1 { font-size: 46px; font-weight: 400; letter-spacing: -.045em; margin: 0 0 10px; }
.lede { font: italic 18px/1.6 Georgia, serif; color: var(--muted); max-width: 720px; margin: 0 0 32px; }
.picker { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0; background: #e9e8e1; }
.picker button { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 6px 16px 6px 10px; border: 1px solid #c5c9bd; border-radius: 999px; background: var(--paper); color: var(--ink); font: 15px/1.2 system-ui, sans-serif; cursor: pointer; }
.picker button img { height: 26px; width: auto; }
.picker button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.note { font-size: 17px; line-height: 1.6; color: #3d4339; max-width: 760px; min-height: 2em; margin: 8px 0 28px; }
.label { font: 500 12px/1.5 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 40px; align-items: start; }
.frame { background: var(--paper); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 0 #d4d4cb, 0 12px 30px rgba(40, 45, 35, .10); }
.desk-box { position: relative; width: 100%; }
.desk-box { height: 600px; }
.desk-box iframe { display: block; width: 100%; height: 100%; border: 0; }
.phone { width: 410px; border-radius: 40px; padding: 10px; background: #2b3027; }
.phone .frame { border-radius: 30px; height: 600px; }
.phone iframe { display: block; width: 390px; height: 100%; border: 0; }
.tabs { display: flex; gap: 28px; align-items: end; margin-top: 40px; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; min-width: 220px; border-radius: 10px 10px 0 0; font: 13px system-ui, sans-serif; color: #202124; }
.tab.light { background: #fff; } .tab.dark { background: #35363a; color: #e8eaed; }
.tab img { height: 16px; width: auto; }
.home { display: grid; justify-items: center; gap: 6px; font: 12px system-ui, sans-serif; color: var(--muted); }
.home .icon { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.home .icon img { height: 44px; width: auto; }
.home .icon.full img { height: 60px; }
.all { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 56px; }
.all .mini { display: flex; align-items: center; gap: 13px; height: 80px; padding: 0 22px; background: var(--paper); border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.all .mini[aria-current="true"] { border-color: var(--ink); }
.all .mini img { height: 40px; width: auto; }
.all .mini span { font-size: 27px; letter-spacing: -.055em; }
.all .mini small { margin-left: auto; font: 13px system-ui, sans-serif; color: var(--muted); letter-spacing: 0; }
@media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } .phone { justify-self: center; } }
@media (max-width: 560px) { .wrap { padding: 32px 16px 80px; } h1 { font-size: 36px; } }
</style></head>
<body><main class="wrap">
<h1>The logo in the header</h1>
<p class="lede">The live reading page, loaded below with each logo swapped in. Pick an option to see it on a desktop and a phone. On phones the name hides, so the mark stands alone there.</p>
<div class="picker" id="picker" role="group" aria-label="Logo option"></div>
<p class="note" id="note"></p>
<div class="stage">
  <div><p class="label">Desktop · actual size</p><div class="frame desk-box" id="desk-box"><iframe id="desk" src="../index.html" title="Desktop reading page" tabindex="-1"></iframe></div></div>
  <div><p class="label">Phone · actual size, 390 wide</p><div class="phone"><div class="frame"><iframe id="phone" src="../index.html" title="Phone reading page" tabindex="-1"></iframe></div></div></div>
</div>
<p class="label" style="margin-top:48px">Small sizes</p>
<div class="tabs" id="tabs"></div>
<p class="label" style="margin-top:56px">All options side by side</p>
<div class="all" id="all"></div>
</main>
<script>
const OPTIONS = [
  ['cur', 'Current', 'The live mark: the scan in greys.'],
  ['l1', 'Flat ink', 'One colour. The rubbing is cut to two tones, so edges are crisp but the lines of letters still show.'],
  ['l2', 'Two-tone', 'Ink plus one mid grey-green. A little more of the stone’s depth than Flat ink, still flat.'],
  ['l3', 'Carved', 'A solid stone with only the brightest letter marks cut out. The calmest at small size.'],
  ['l4', 'Dark tile', 'The carved stone reversed out of a rounded square, like an iOS app icon. Also works as a favicon and home-screen icon.'],
  ['l5', 'Light tile', 'Flat ink on a pale rounded tile with a hairline edge. Softer than the dark tile.'],
  ['l6', 'Accent', 'Flat ink in the site’s green accent rather than black.'],
];
const src = id => `assets/logo-${id}.png`;
const picker = document.getElementById('picker');
const all = document.getElementById('all');
let current = 'cur';
try { current = new URLSearchParams(location.search).get('logo') || localStorage.getItem('rosettapada-logo-preview') || 'cur'; } catch (e) {}
if (!OPTIONS.some(o => o[0] === current)) current = 'cur';

OPTIONS.forEach(([id, name]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = id;
  b.innerHTML = `<img src="${src(id)}" alt="">${name}`;
  b.addEventListener('click', () => pick(id));
  picker.append(b);
  const m = document.createElement('div');
  m.className = 'mini'; m.dataset.id = id; m.tabIndex = 0;
  m.innerHTML = `<img src="${src(id)}" alt=""><span>Rosettapada</span><small>${name}</small>`;
  m.addEventListener('click', () => { pick(id); window.scrollTo({top: 0, behavior: 'smooth'}); });
  all.append(m);
});

function swap(frame) {
  try {
    frame.contentDocument.querySelectorAll('.brand-mark').forEach(img => { img.src = `design-preview/${src(current)}`; });
  } catch (e) {}
}
function pick(id) {
  current = id;
  try { localStorage.setItem('rosettapada-logo-preview', id); } catch (e) {}
  const opt = OPTIONS.find(o => o[0] === id);
  picker.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  all.querySelectorAll('.mini').forEach(m => m.setAttribute('aria-current', String(m.dataset.id === id)));
  document.getElementById('note').innerHTML = `<b>${opt[1]}.</b> ${opt[2]}`;
  ['desk', 'phone'].forEach(f => swap(document.getElementById(f)));
  const square = id === 'l4' || id === 'l5';
  document.getElementById('tabs').innerHTML =
    `<span class="tab light"><img src="${src(id)}" alt="">Pairs · Rosettapada</span>` +
    `<span class="tab dark"><img src="${src(id)}" alt="">Pairs · Rosettapada</span>` +
    `<span class="home"><span class="icon${square ? ' full' : ''}"><img src="${src(id)}" alt=""></span>Rosettapada</span>`;
}
['desk', 'phone'].forEach(f => document.getElementById(f).addEventListener('load', e => swap(e.target)));

pick(current);
</script>
</body></html>
