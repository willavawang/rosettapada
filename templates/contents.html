<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <title>Contents · Rosettapada</title>
  <link rel="stylesheet" href="styles.css?v={{STYLE_VERSION}}">
</head>
<body class="document-page">
  <header class="masthead"><a class="wordmark" href="index.html"><img class="brand-mark" src="assets/logo-carved.png" alt="" width="27" height="40">Rosettapada</a><nav class="top-nav" aria-label="Main navigation"><a class="back-link" id="back-link" href="index.html"><span aria-hidden="true">‹</span>Back</a></nav></header>
  <main class="document-wrap contents-wrap">
    <h1>Contents</h1>
    <nav class="toc-pages" aria-label="Chapters">
      {{CHAPTER_LINKS}}
    </nav>
  </main>
  <script>
    // Return to the chapter last read, at the magnification it was read at.
    (() => {
      try {
        const last = JSON.parse(localStorage.getItem('rosettapada-last-reading'));
        const link = document.getElementById('back-link');
        if (last && /^[a-z0-9-]+\.html$/.test(last.page)) {
          link.href = last.page;
          link.lastChild.textContent = last.title ? `Back to ${last.title}` : 'Back';
        }
        if (last && Number.isFinite(last.zoom)) document.querySelector('.document-wrap').style.zoom = String(Math.min(1.3, Math.max(.6, last.zoom)));
      } catch { /* The link still returns to the first chapter. */ }
    })();
  </script>
</body>
</html>
