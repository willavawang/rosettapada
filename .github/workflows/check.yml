name: Check reading study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 build.py
      - run: python3 tools/check.py
      - run: node --check reader.js
      - name: Generated pages are current
        run: git diff --exit-code -- '*.html'

